  #mx-fan-alternatives .mx-fan[data-design='integrada'] .mx-trigger svg, #mx-fan-alternatives .mx-fan[data-design='integrada'] .mx-trigger .mx-caption, #mx-fan-alternatives .mx-fan[data-design='integrada'] .mx-trigger .mx-value { position: absolute; left: 10px; margin: 0; transition: left var(--mx-morph-duration, 380ms) cubic-bezier(.22, .8, .25, 1), top var(--mx-morph-duration, 380ms) cubic-bezier(.22, .8, .25, 1); }

<div id="mx-fan-alternatives">
  <template id="mx-fan-design-template">
    <div class="mx-app" aria-label="Controles de Mi X5">
      <div class="mx-setpoint" aria-hidden="true">23<small>°C</small></div>
      <div class="mx-temperature" aria-hidden="true"></div>
      <div class="mx-cards">
        <div class="mx-tile"><i data-lucide="snowflake" aria-hidden="true"></i><span class="mx-caption">Modo</span><span class="mx-value">Frío</span></div>
        <div class="mx-fan">
          <div class="mx-expandable">
          <button class="mx-tile mx-trigger cursor-interaction" type="button" aria-label="Seleccionar velocidad del ventilador" aria-expanded="false"><i data-lucide="fan" aria-hidden="true"></i><span class="mx-caption">Ventilador</span><span class="mx-value" aria-live="polite">Auto</span></button>
          <div class="mx-popup" hidden><div class="mx-bar">
            <div class="mx-rail"><div class="mx-dots" aria-hidden="true" hidden><span></span><span></span><span></span><span></span><span></span><span></span></div><span class="mx-knob" aria-hidden="true"></span><input class="mx-range" type="range" min="0" max="5" step="1" value="0" aria-label="Velocidad del ventilador" aria-valuetext="Auto"></div>
            <div class="mx-labels" aria-hidden="true"><span>Auto</span><span>Silencioso</span><span>Bajo</span><span>Medio</span><span>Alto</span><span>Turbo</span></div>
          </div></div>
          </div>
        </div>
        <div class="mx-tile"><i data-lucide="wind" aria-hidden="true"></i><span class="mx-caption">Flujo de aire</span><span class="mx-value">Vertical</span></div>
      </div>
    </div>
  </template>
  <div class="viz-row" role="group" aria-label="Elegir alternativa de diseño">
    <button class="btn" type="button" data-design-choice="carril" aria-pressed="false" aria-controls="mx-design-carril">Carril compacto</button>
    <button class="btn" type="button" data-design-choice="puntos" aria-pressed="false" aria-controls="mx-design-puntos">Puntos</button>
    <button class="btn" type="button" data-design-choice="segmentos" aria-pressed="false" aria-controls="mx-design-segmentos">Segmentos</button>
    <button class="btn" type="button" data-design-choice="integrada" aria-pressed="true" aria-controls="mx-design-integrada">Tarjeta expandible</button>
  </div>
  <div class="viz-dotted-background" aria-label="Alternativas del selector de ventilador">
    <section id="mx-design-carril" class="mx-stage" data-variant="Carril compacto" data-design="carril" aria-label="Carril compacto con salto" hidden></section>
    <section id="mx-design-puntos" class="mx-stage" data-variant="Puntos" data-design="puntos" aria-label="Escala de puntos con resorte" hidden></section>
    <section id="mx-design-segmentos" class="mx-stage" data-variant="Segmentos" data-design="segmentos" aria-label="Barra segmentada con deslizamiento" hidden></section>
    <section id="mx-design-integrada" class="mx-stage" data-variant="Tarjeta expandible" data-design="integrada" aria-label="Tarjeta expandible con barra integrada"></section>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('mx-fan-alternatives');
  const template = root.querySelector('template');
  const stages = [...root.querySelectorAll('[data-variant]')];
  const designButtons = [...root.querySelectorAll('[data-design-choice]')];
  designButtons.forEach(button => {
    button.onclick = () => {
      stages.forEach(stage => { stage.hidden = stage.dataset.design !== button.dataset.designChoice; });
      designButtons.forEach(choice => choice.setAttribute('aria-pressed', String(choice === button)));
    };
  });
  const labels = ['Auto', 'Silencioso', 'Bajo', 'Medio', 'Alto', 'Turbo'];
  const defaults = { carril: 'salto', puntos: 'resorte', segmentos: 'deslizamiento', integrada: 'resorte' };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const states = new Map();
  const saved = window.openai?.widgetState?.modelContent?.fanAlternatives || {};
  const restoreIndex = value => Number.isInteger(value) && value >= 0 && value < labels.length ? value : 0;
  function restore(state, value = {}) {
    state.index = restoreIndex(value.index);
    if (Number.isFinite(value.width)) state.width = Math.max(270, Math.min(340, value.width));
    if (Number.isFinite(value.duration)) state.duration = Math.max(180, Math.min(420, value.duration));
    if (['salto', 'resorte', 'deslizamiento'].includes(value.animation)) state.animation = value.animation;
  }
  function remember() {
    const choices = Object.fromEntries([...states].map(([key, { state }]) => [key, { index: state.index, animation: state.animation, width: state.width, duration: state.duration }]));
    window.openai?.setWidgetState?.({ modelContent: { fanAlternatives: choices } })?.catch(() => {});
  }
  stages.forEach(stage => {
    stage.append(template.content.cloneNode(true));
    const design = stage.dataset.design;
    const fan = stage.querySelector('.mx-fan');
    fan.dataset.design = design;
    fan.setAttribute('aria-label', stage.dataset.variant);
    const button = fan.querySelector('.mx-trigger');
    const popup = fan.querySelector('.mx-popup');
    popup.id = 'mx-fan-' + design + '-popup';
    popup.setAttribute('role', 'group');
    popup.setAttribute('aria-label', 'Velocidad del ventilador');
    button.setAttribute('aria-controls', popup.id);
    const bar = fan.querySelector('.mx-bar');
    const expandable = fan.querySelector('.mx-expandable');
    const rail = fan.querySelector('.mx-rail');
    const slider = fan.querySelector('.mx-range');
    let marker = fan.querySelector('.mx-knob');
    const caption = button.querySelector('.mx-value');
    const state = { index: 0, width: 310, duration: 280, animation: defaults[design] };
    restore(state, saved[design]);
    states.set(design, { state, render });
    let motion;
    let openMotion;
    let segmentButtons = [];
    if (design === 'puntos') fan.querySelector('.mx-dots').hidden = false;
    if (design === 'segmentos') {
      rail.remove();
      fan.querySelector('.mx-labels').remove();
      const segments = document.createElement('div');
      segments.className = 'mx-segments';
      segments.setAttribute('role', 'group');
      segments.setAttribute('aria-label', 'Velocidad del ventilador');
      marker = document.createElement('span');
      marker.className = 'mx-segment-highlight';
      marker.setAttribute('aria-hidden', 'true');
      segments.append(marker);
      segmentButtons = labels.map((label, index) => {
        const option = document.createElement('button');
        option.type = 'button';
        option.className = 'cursor-interaction';
        option.textContent = index === 1 ? 'Silenc.' : label;
        option.setAttribute('aria-label', label);
        option.onclick = () => choose(index);
        segments.append(option);
        return option;
      });
      bar.append(segments);
    }
    function render() {
      fan.style.setProperty('--mx-index', state.index);
      fan.style.setProperty('--mx-bar-width', state.width + 'px');
      fan.style.setProperty('--mx-morph-duration', state.duration + 100 + 'ms');
      caption.textContent = labels[state.index];
      slider.value = state.index;
      slider.setAttribute('aria-valuetext', labels[state.index]);
      fan.querySelectorAll('.mx-labels span').forEach((label, index) => { label.style.setProperty('--mx-step', index); label.dataset.active = String(index === state.index); });
      segmentButtons.forEach((option, index) => option.setAttribute('aria-pressed', String(index === state.index)));
    }
    function choose(index) {
      if (!Number.isInteger(index) || index < 0 || index >= labels.length || index === state.index) return;
      const before = state.index;
      state.index = index;
      render();
      motion?.cancel();
      if (!reduced.matches) {
        const base = design === 'segmentos' ? '' : 'translate(-50%, -50%) ';
        let frames;
        if (state.animation === 'salto') {
          frames = [{ transform: base + 'translateY(0)' }, { transform: base + 'translateY(-7px)', offset: .45 }, { transform: base + 'translateY(0)' }];
        } else if (state.animation === 'resorte') {
          const direction = Math.sign(index - before);
          frames = [{ transform: base + 'scale(.85)' }, { transform: base + 'translateX(' + direction * 5 + 'px) scale(1.08)', offset: .65 }, { transform: base + 'scale(1)' }];
        } else {
          frames = [{ transform: base + 'scaleX(1)' }, { transform: base + 'scaleX(1.25) scaleY(.92)', offset: .4 }, { transform: base + 'scaleX(1)' }];
        }
        motion = marker.animate(frames, { duration: state.duration, easing: 'ease-out' });
      }
      remember();
    }
    function setOpen(open) {
      const changed = popup.hidden === open;
      popup.hidden = !open;
      fan.classList.toggle('is-open', open);
      button.setAttribute('aria-expanded', String(open));
      if (!open) openMotion?.cancel();
      if (open && changed && !reduced.matches && design !== 'integrada') {
        openMotion?.cancel();
        const frames = design === 'puntos' ? [{ transform: 'translateY(5px) scale(.98)' }, { transform: 'translateY(-2px) scale(1.01)', offset: .7 }, { transform: 'none' }] : design === 'segmentos' ? [{ transform: 'translateY(5px)' }, { transform: 'none' }] : [{ transform: 'translateY(6px) scale(.96)' }, { transform: 'translateY(-2px) scale(1.01)', offset: .7 }, { transform: 'none' }];
        openMotion = bar.animate(frames, { duration: state.duration, easing: 'ease-out' });
      }
    }
    fan.onpointerenter = event => { if (event.pointerType === 'mouse') setOpen(true); };
    fan.onpointerleave = event => { if (event.pointerType === 'mouse') setOpen(false); };
    fan.onfocusin = event => { if (event.target.matches(':focus-visible')) setOpen(true); };
    fan.onfocusout = event => { if (!fan.contains(event.relatedTarget) && !fan.matches(':hover')) setOpen(false); };
    fan.onkeydown = event => { if (event.key === 'Escape') { event.preventDefault(); button.focus(); setOpen(false); } };
    button.onclick = event => { if (event.detail === 0 || !matchMedia('(hover: hover)').matches) setOpen(popup.hidden); };
    slider.oninput = event => choose(Number(event.target.value));
    if (design === 'integrada') {
      // Measure the revealed content so labels and touch targets fit the morph.
      new ResizeObserver(() => {
        if (popup.offsetHeight) expandable.style.setProperty('--mx-open-height', 48 + popup.offsetHeight + 'px');
      }).observe(popup);
    }
    render();
    if (globalThis.Tweak) {
      const tweak = new Tweak({ container: fan, onChange: () => { render(); remember(); } });
      tweak.addSlider(state, 'width', { label: 'Ancho de la barra', min: 270, max: 340, step: 5, unit: 'px' });
      tweak.addSelect(state, 'animation', { label: 'Movimiento al seleccionar', options: [{ label: 'Salto suave', value: 'salto' }, { label: 'Resorte', value: 'resorte' }, { label: 'Deslizamiento elástico', value: 'deslizamiento' }] });
      tweak.addSlider(state, 'duration', { label: 'Duración de la animación', min: 180, max: 420, step: 20, unit: 'ms' });
    }
  });
  globalThis.lucide?.createIcons({ attrs: { width: 21, height: 21 } });
  window.addEventListener('openai:set_globals', event => {
    const restored = event.detail?.globals?.widgetState?.modelContent?.fanAlternatives;
    if (!restored) return;
    states.forEach(({ state, render }, design) => { if (restored[design]) { restore(state, restored[design]); render(); } });
  });
})();
</script>
